# Render Blueprint — the backend API as a native Python web service (free plan).
# Render → New → Blueprint → pick this repository. Values marked `sync: false` are entered in the dashboard.
# The frontend is deployed separately on Vercel (see README → Deployment).

services:
  - type: web
    name: sql-query-agent-api
    runtime: python
    plan: free
    region: oregon                      # closest to Bedrock in us-west-2
    rootDir: backend
    buildCommand: pip install -e .
    # One worker: the rate limiter and the SQLite stores are per process.
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      # ── LLM: AWS Bedrock ──
      - key: AWS_BEARER_TOKEN_BEDROCK
        sync: false
      - key: AWS_REGION
        value: us-west-2
      - key: LLM_MODEL_FAST
        value: us.anthropic.claude-haiku-5-5
      - key: LLM_MODEL_MAIN
        value: us.anthropic.claude-haiku-5-5
      # ── Test accounts ──
      - key: AUTH_NORMAL_USERNAME
        value: demo
      - key: AUTH_NORMAL_PASSWORD
        sync: false
      - key: AUTH_DEV_USERNAME
        value: developer
      - key: AUTH_DEV_PASSWORD
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      # ── Browser access from the Vercel frontend ──
      # Any origin may call the API: auth is a Bearer token held by the app (no cookies), so this only
      # removes the origin check, and the rate limits still apply. To restrict it, list the frontend URL(s),
      # e.g. ["https://unifyapps-fd-assignment.vercel.app"].
      - key: CORS_ORIGINS
        value: '["*"]'

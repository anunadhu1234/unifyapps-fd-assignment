[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sql-agent"
version = "0.1.0"
description = "LangGraph agent that turns natural language into validated, read-only SQL over a documented schema."
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "langchain-aws>=1.0",
    "boto3>=1.39",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlglot>=25.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "langgraph-checkpoint-sqlite>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyjwt>=2.8",
]

[project.optional-dependencies]
data = [
    "faker>=30.0",
    "openpyxl>=3.1",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
# PDF export of the docs (scripts/export_docs_pdf.py); also run: python -m playwright install chromium
docs = [
    "markdown>=3.7",
    "pygments>=2.18",
    "playwright>=1.50",
]

[tool.setuptools.packages.find]
include = ["agent*", "prompt_library*", "routes*", "controllers*", "middleware*", "utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are meant to be called in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Path", "fastapi.Header", "fastapi.Query", "fastapi.Body"]
